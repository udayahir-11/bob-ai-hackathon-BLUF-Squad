submission:
  title: "Threat Intelligence Correlation & Alert Prioritisation Assistant"

  problem_statement: >
    Defence analysts are overwhelmed by thousands of daily alerts from disparate sources
    (SIEM, satellite, cyber sensors, intel reports), making it impossible to manually
    distinguish genuine threats from false positives while producing timely, structured
    BLUF reports for commanders.

  solution_summary: >
    A zero-dependency C++17 assistant that ingests multi-source threat feeds, runs a
    7-stage processing pipeline to filter false positives, maps attacker techniques to
    MITRE ATT&CK, assigns confidence-weighted priority tiers, correlates alerts into
    adversary campaign groups, and auto-generates prioritised BLUF summaries — enabling
    commanders to act within minutes.

  key_features:
    - "Multi-source alert correlation across SIEM, satellite, cyber sensors, and intel reports into unified de-duplicated incidents"
    - "False positive filtering using rule-based scoring (loopback, RFC-1918, UDP/ICMP noise, benign resolvers)"
    - "Attacker technique mapping to MITRE ATT&CK framework via keyword + protocol matching"
    - "Confidence-weighted priority tiers (CRITICAL / HIGH / MEDIUM / LOW) with source and tactic boost factors"
    - "IP-subnet campaign correlation grouping related alerts into adversary campaign groups"
    - "Automated BLUF report generation producing commander-ready terminal, JSON, CSV, and HTML dashboard outputs"

  tech_stack:
    languages:
      - "C++17"
    frameworks:
      - "C++ Standard Library (STL) — no external dependencies"
    ibm_technologies:
      - "IBM Bob (AI-assisted development & code generation)"
    
    other:
      - "MITRE ATT&CK Framework"
      - "GCC 7+ / Clang 5+ / MSVC 2017+"
      - "HTML/CSS (runtime-generated commander dashboard)"

  what_we_are_most_proud_of: >
    The end-to-end pipeline runs as a zero-dependency, single-file C++ solution that
    takes raw, noisy multi-source alerts and produces a polished commander dashboard in
    one command — no install, no config, no cloud account needed.
    The 7-stage processing pipeline (false-positive filtering → MITRE ATT&CK mapping →
    threat categorisation → confidence-weighted priority assignment → IP-subnet campaign
    correlation → per-alert BLUF generation → sorted output) runs in milliseconds and
    each stage is independently testable. The runtime-generated HTML dashboard delivers
    a dark-theme, colour-coded commander view with a BLUF summary card, statistics grid,
    and a fully enriched alert table — all without a single frontend framework or build step.

  known_limitations: >
    Static GeoIP table: country tags are resolved from a hard-coded lookup map; production
    use would require MaxMind GeoLite2 or a live GeoIP API.
    Keyword-based MITRE mapping: technique assignment relies on keyword matching in alert
    descriptions; a trained NLP classifier would improve accuracy on ambiguous threats.
    No live feed ingestion: the system reads from a static CSV file; integration with live
    SIEM APIs or streaming pipelines is not implemented.
    Single-threaded pipeline: very large alert volumes (100k+) would benefit from
    parallelisation.
    No persistent storage: results are written to files on each run with no database layer
    or historical trend analysis.

